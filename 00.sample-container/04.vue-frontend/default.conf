server {
    listen 80;

    # Vue Router가 history 모드(주소창에 #이 붙지 않는 방식)를 쓰기 때문에,
    # /orders/new 같은 경로로 직접 접속(새로고침)해도 항상 index.html을 내려주고
    # 이후 라우팅은 브라우저의 Vue Router가 처리하도록 한다.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 01.spring-backend-v1.0 REST API / Actuator 프록시
    # 브라우저는 같은 오리진의 /api, /python, /actuator 로만 호출하고,
    # nginx가 내부적으로 webserver:8080 으로 전달한다.
    # (docker network / k8s Service의 DNS 이름이 반드시 "webserver"여야 한다)
    # k8s 배포 시에는 이 세 경로를 Ingress 단계에서 바로 webserver Service로 라우팅하므로
    # (k8s/ingress.t 참고) 아래 블록은 기본적으로 꺼둔다. 로컬 docker 실행 시에만 주석을 해제한다.
#    location /api/ {
#        proxy_pass http://webserver:8080/api/;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#    }
}
